<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebDAV 播放器</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #0f1115;
      color: #e6e6e6;
      min-height: 100vh;
    }
    .container { max-width: 900px; margin: 0 auto; padding: 24px 16px 80px; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }
    h1 { font-size: 22px; font-weight: 600; }
    .btn {
      background: #2563eb; color: #fff; border: none; padding: 8px 16px;
      border-radius: 8px; cursor: pointer; font-size: 14px;
    }
    .btn:hover { background: #1d4ed8; }
    .btn.secondary { background: #374151; }
    .btn.secondary:hover { background: #4b5563; }
    .btn.danger { background: #dc2626; }
    .btn.danger:hover { background: #b91c1c; }
    .btn.small { padding: 4px 10px; font-size: 12px; }

    .card {
      background: #1a1d24; border: 1px solid #2a2e38; border-radius: 12px;
      padding: 16px; margin-bottom: 12px;
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; transition: border-color .15s;
    }
    .card:hover { border-color: #3b82f6; }
    .card .title { font-size: 16px; font-weight: 500; }
    .card .sub { font-size: 12px; color: #9ca3af; margin-top: 4px; }
    .card .actions { display: flex; gap: 8px; }
    .empty { text-align: center; color: #9ca3af; padding: 40px 0; }

    form { background: #1a1d24; border: 1px solid #2a2e38; border-radius: 12px; padding: 20px; }
    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 13px; color: #9ca3af; margin-bottom: 6px; }
    .field input[type="text"], .field input[type="password"], .field input[type="number"] {
      width: 100%; background: #0f1115; border: 1px solid #2a2e38; color: #e6e6e6;
      padding: 10px 12px; border-radius: 8px; font-size: 14px;
    }
    .field input:focus { outline: none; border-color: #3b82f6; }
    .field.checkbox { display: flex; align-items: center; gap: 8px; }
    .field.checkbox label { margin: 0; }
    .form-actions { display: flex; gap: 10px; margin-top: 8px; }

    .breadcrumb { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .breadcrumb a { color: #3b82f6; text-decoration: none; font-size: 14px; }
    .breadcrumb a:hover { text-decoration: underline; }
    .breadcrumb span { color: #9ca3af; font-size: 14px; }

    .file-row {
      display: flex; align-items: center; gap: 12px; padding: 12px 14px;
      background: #1a1d24; border: 1px solid #2a2e38; border-radius: 10px;
      margin-bottom: 8px; cursor: pointer; transition: border-color .15s;
    }
    .file-row:hover { border-color: #3b82f6; }
    .file-row .icon { font-size: 20px; width: 24px; text-align: center; }
    .file-row .name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-row .meta { font-size: 12px; color: #9ca3af; }

    .player-wrap { background: #000; border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
    video, audio { width: 100%; display: block; }
    .now-playing { font-size: 14px; color: #9ca3af; margin-bottom: 12px; }
    .now-playing strong { color: #e6e6e6; }

    .toast {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #374151; color: #fff; padding: 10px 18px; border-radius: 8px;
      font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 100;
    }
    .toast.show { opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>🎵 WebDAV 播放器</h1>
      <div id="header-actions"></div>
    </header>
    <div id="view"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script>
    const AUDIO_EXT = ['mp3', 'wav', 'ogg', 'm4a', 'flac', 'aac'];
    const VIDEO_EXT = ['mp4', 'webm', 'mkv', 'mov', 'm4v', 'avi'];

    const $view = document.getElementById('view');
    const $toast = document.getElementById('toast');
    const $headerActions = document.getElementById('header-actions');

    function toast(msg) {
      $toast.textContent = msg;
      $toast.classList.add('show');
      setTimeout(() => $toast.classList.remove('show'), 2500);
    }

    function ext(name) {
      const i = name.lastIndexOf('.');
      return i === -1 ? '' : name.slice(i + 1).toLowerCase();
    }
    function isAudio(name) { return AUDIO_EXT.includes(ext(name)); }
    function isVideo(name) { return VIDEO_EXT.includes(ext(name)); }
    function isMedia(name) { return isAudio(name) || isVideo(name); }
    function fmtSize(n) {
      if (!n) return '';
      const u = ['B', 'KB', 'MB', 'GB'];
      let i = 0;
      while (n >= 1024 && i < u.length - 1) { n /= 1024; i++; }
      return n.toFixed(1) + ' ' + u[i];
    }

    async function api(url, opts) {
      const res = await fetch(url, opts);
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || '请求失败');
      return data;
    }

    // ---------- View: server list ----------
    async function renderServerList() {
      $headerActions.innerHTML = '<button class="btn" onclick="showNewServer()">＋ 新建服务器</button>';
      let servers;
      try { servers = await api('/api/servers'); }
      catch (e) { $view.innerHTML = `<div class="empty">加载失败: ${e.message}</div>`; return; }

      if (!servers.length) {
        $view.innerHTML = `<div class="empty">还没有服务器，点击右上角「新建服务器」开始</div>`;
        return;
      }
      $view.innerHTML = servers.map(s => `
        <div class="card" onclick="openServer('${s.id}')">
          <div>
            <div class="title">${esc(s.title)}</div>
            <div class="sub">${esc(s.host)}${s.port ? ':' + s.port : ''}${s.path ? esc(s.path) : ''} · ${s.https ? 'HTTPS' : 'HTTP'}</div>
          </div>
          <div class="actions">
            <button class="btn danger small" onclick="event.stopPropagation(); deleteServer('${s.id}')">删除</button>
          </div>
        </div>
      `).join('');
    }

    async function deleteServer(id) {
      if (!confirm('确定删除该服务器？')) return;
      try { await api('/api/servers/' + id, { method: 'DELETE' }); toast('已删除'); renderServerList(); }
      catch (e) { toast(e.message); }
    }

    // ---------- View: new server ----------
    function showNewServer() {
      $headerActions.innerHTML = '<button class="btn secondary" onclick="renderServerList()">← 返回</button>';
      $view.innerHTML = `
        <form onsubmit="submitNewServer(event)">
          <div class="field"><label>标题 *</label><input type="text" id="f-title" required placeholder="例如：我的 NAS"></div>
          <div class="field"><label>主机 *</label><input type="text" id="f-host" required placeholder="例如：192.168.1.100 或 nas.example.com"></div>
          <div class="field"><label>用户名 *</label><input type="text" id="f-user" required></div>
          <div class="field"><label>密码 *</label><input type="password" id="f-pass" required></div>
          <div class="field"><label>端口（可选）</label><input type="number" id="f-port" placeholder="默认 80/443"></div>
          <div class="field"><label>路径（可选）</label><input type="text" id="f-path" placeholder="例如：/dav 或 /remote.php/dav"></div>
          <div class="field checkbox"><input type="checkbox" id="f-https"><label for="f-https">使用 HTTPS</label></div>
          <div class="form-actions">
            <button type="submit" class="btn">保存</button>
            <button type="button" class="btn secondary" onclick="renderServerList()">取消</button>
          </div>
        </form>
      `;
    }

    async function submitNewServer(e) {
      e.preventDefault();
      const body = {
        title: document.getElementById('f-title').value.trim(),
        host: document.getElementById('f-host').value.trim(),
        username: document.getElementById('f-user').value.trim(),
        password: document.getElementById('f-pass').value,
        port: document.getElementById('f-port').value,
        path: document.getElementById('f-path').value.trim(),
        https: document.getElementById('f-https').checked,
      };
      try {
        await api('/api/servers', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        toast('已添加服务器');
        renderServerList();
      } catch (err) { toast(err.message); }
    }

    // ---------- View: file list ----------
    let currentServerId = null;
    let currentPath = '/';

    async function openServer(id) {
      currentServerId = id;
      currentPath = '/';
      await renderFileList();
    }

    async function renderFileList() {
      $headerActions.innerHTML = '<button class="btn secondary" onclick="renderServerList()">← 服务器列表</button>';
      const path = currentPath;
      let data;
      try { data = await api(`/api/servers/${currentServerId}/list?path=${encodeURIComponent(path)}`); }
      catch (e) { $view.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }

      // breadcrumb
      const parts = path.split('/').filter(Boolean);
      let crumb = '<a href="#" onclick="event.preventDefault(); goDir(\'/\')">根目录</a>';
      let acc = '';
      parts.forEach((p, i) => {
        acc += '/' + p;
        crumb += ' <span>/</span> <a href="#" onclick="event.preventDefault(); goDir(\'' + acc + '\')">' + esc(p) + '</a>';
      });

      const dirs = data.items.filter(i => i.type === 'directory');
      const files = data.items.filter(i => i.type === 'file');

      let html = `<div class="breadcrumb">${crumb}</div>`;
      if (!dirs.length && !files.length) html += '<div class="empty">此目录为空</div>';

      dirs.forEach(d => {
        html += `<div class="file-row" onclick="goDir('${escAttr(d.path)}')">
          <div class="icon">📁</div><div class="name">${esc(d.name)}</div><div class="meta">目录</div>
        </div>`;
      });
      files.forEach(f => {
        const media = isMedia(f.name);
        const icon = isAudio(f.name) ? '🎵' : isVideo(f.name) ? '🎬' : '📄';
        html += `<div class="file-row" ${media ? `onclick="playFile('${escAttr(f.path)}', '${escAttr(f.name)}')"` : ''}>
          <div class="icon">${icon}</div><div class="name">${esc(f.name)}</div>
          <div class="meta">${fmtSize(f.size)}${media ? ' · 点击播放' : ''}</div>
        </div>`;
      });
      $view.innerHTML = html;
    }

    function goDir(p) {
      currentPath = p;
      renderFileList();
    }

    // ---------- View: player ----------
    function playFile(filePath, name) {
      const url = `/api/servers/${currentServerId}/stream?path=${encodeURIComponent(filePath)}`;
      const isV = isVideo(name);
      $headerActions.innerHTML = '<button class="btn secondary" onclick="renderFileList()">← 返回</button>';
      $view.innerHTML = `
        <div class="now-playing">正在播放：<strong>${esc(name)}</strong></div>
        <div class="player-wrap">
          ${isV
            ? `<video controls autoplay src="${url}"></video>`
            : `<audio controls autoplay src="${url}"></audio>`}
        </div>
      `;
    }

    // ---------- helpers ----------
    function esc(s) {
      return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    }
    function escAttr(s) {
      return String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // init
    renderServerList();
  </script>
</body>
</html>
